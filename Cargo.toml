[package]
name = "lockpick"
version = "0.1.0"
edition = "2024"
description = "A blazing-fast JS/TS dependency analyzer CLI built with Rust"
license = "MIT"
repository = "https://github.com/Dean0801/lockpick"
keywords = ["pnpm", "dependency", "analyzer", "audit", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
oxc_parser = "0.115"
oxc_allocator = "0.115"
oxc_span = "0.115"
oxc_ast = "0.115"
owo-colors = "4"
comfy-table = "7"
indicatif = "0.17"
miette = { version = "7", features = ["fancy"] }
glob = "0.3"
