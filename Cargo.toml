[package]
name = "lockpick"
version = "0.8.0"
edition = "2024"
description = "A blazing-fast JS/TS dependency analyzer CLI built with Rust"
license = "MIT"
repository = "https://github.com/Dean0801/lockpick"
keywords = ["pnpm", "npm", "yarn", "dependency", "analyzer"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
oxc_parser = "0.115"
oxc_allocator = "0.115"
oxc_span = "0.115"
oxc_ast = "0.115"
owo-colors = "4"
comfy-table = "7"
indicatif = "0.17"
walkdir = "2"
glob = "0.3"
thiserror = "2"
dirs = "6"
ratatui = "0.28"
crossterm = "0.28"
tui-input = "0.10"

[dev-dependencies]
tempfile = "3"
