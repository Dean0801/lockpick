name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            pkg: lockpick-cli-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            pkg: lockpick-cli-darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            pkg: lockpick-cli-linux-x64-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            pkg: lockpick-cli-linux-x64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            pkg: lockpick-cli-linux-arm64-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            pkg: lockpick-cli-win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: target/${{ matrix.target }}/release/lockpick

      - name: Upload artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: target/${{ matrix.target }}/release/lockpick.exe

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare platform packages
        run: |
          for pkg in lockpick-cli-darwin-arm64 lockpick-cli-darwin-x64 lockpick-cli-linux-x64-gnu lockpick-cli-linux-x64-musl lockpick-cli-linux-arm64-gnu lockpick-cli-win32-x64; do
            if [[ "$pkg" == *"win32"* ]]; then
              cp "artifacts/$pkg/lockpick.exe" "npm/$pkg/lockpick.exe"
            else
              cp "artifacts/$pkg/lockpick" "npm/$pkg/lockpick"
              chmod +x "npm/$pkg/lockpick"
            fi
          done

      - name: Sync versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for pkg in npm/lockpick-cli*/package.json; do
            sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" "$pkg"
          done
          sed -i "s/\"lockpick-cli-\([^\"]*\)\": \"[^\"]*\"/\"lockpick-cli-\1\": \"$VERSION\"/g" npm/lockpick-cli/package.json

      - name: Sync README
        run: cp README.md npm/lockpick-cli/README.md

      - name: Publish platform packages
        run: |
          for pkg in ./npm/lockpick-cli-*/; do
            npm publish "$pkg" --access public || true
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        run: npm publish ./npm/lockpick-cli --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts
        run: |
          mv artifacts/lockpick-cli-darwin-arm64/lockpick      artifacts/lockpick-darwin-arm64
          mv artifacts/lockpick-cli-darwin-x64/lockpick        artifacts/lockpick-darwin-x64
          mv artifacts/lockpick-cli-linux-x64-gnu/lockpick     artifacts/lockpick-linux-x64-gnu
          mv artifacts/lockpick-cli-linux-x64-musl/lockpick    artifacts/lockpick-linux-x64-musl
          mv artifacts/lockpick-cli-linux-arm64-gnu/lockpick   artifacts/lockpick-linux-arm64-gnu
          mv artifacts/lockpick-cli-win32-x64/lockpick.exe     artifacts/lockpick-win32-x64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/lockpick-*
