lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:
  .:
    dependencies:
      react:
        specifier: ^18.2.0
        version: 18.2.0
      lodash:
        specifier: ^4.17.21
        version: 4.17.21
    devDependencies:
      typescript:
        specifier: ^5.3.3
        version: 5.3.3
      '@types/react':
        specifier: ^18.2.0
        version: 18.2.48

packages:
  react@18.2.0:
    resolution: {integrity: sha512-fake-react-integrity}
    engines: {node: '>=0.10.0'}

  lodash@4.17.21:
    resolution: {integrity: sha512-fake-lodash-integrity}

  typescript@5.3.3:
    resolution: {integrity: sha512-fake-ts-integrity}
    hasBin: true

  '@types/react@18.2.48':
    resolution: {integrity: sha512-fake-types-react-integrity}
